pre-commit:
  parallel: true
  jobs:
    # One after another, and only these three: rubocop rewrites the staged
    # Ruby files, and the two jobs after it read lib/. Run side by side, the
    # diagrams would be drawn from a file rubocop was halfway through fixing,
    # and two `git add`s would meet on .git/index.lock.
    - name: ruby
      group:
        piped: true
        jobs:
          - name: rubocop
            glob: "**/*.{rb,rake,gemspec}"
            # --force-exclusion is load-bearing, not decoration. RuboCop honours
            # AllCops/Exclude when it walks the tree itself, but IGNORES it for
            # paths passed explicitly on the command line, which is exactly what
            # {staged_files} does. Without this flag the recorded agent output
            # under evals/cases/, deliberately imperfect in fail/, is
            # autocorrected on its way into a commit and the eval stops scoring
            # what the agent wrote.
            run: bundle exec rubocop -a --force-exclusion --format progress {staged_files}
            stage_fixed: true

          # docs/architecture/ is drawn from lib/, and
          # spec/openlanes/docs/architecture_doc_spec.rb fails the suite when
          # it is stale, which is what turned #196 red. `stage_fixed` would not
          # help here: it re-stages the files the glob matched (lib/), and the
          # files this job rewrites are the diagrams.
          - name: architecture
            glob: "lib/**/*.rb"
            run: just update-architecture && git add docs/architecture
            fail_text: |
              Commit blocked: docs/architecture/ could not be regenerated from lib/.
                Run `just update-architecture` and read its error.

          # Only the spec files in this commit. The whole suite takes about
          # seven minutes and belongs to `just test` and to CI.
          - name: rspec
            glob: "spec/**/*_spec.rb"
            run: bundle exec rspec --format progress {staged_files}

    # The page lints with eslint (web/package.json has no formatter). A fresh
    # worktree has no web/node_modules, and refusing every commit there until
    # `npm ci` has run would cost more than it catches: CI's `web` job lints
    # the page too.
    - name: eslint
      root: "web/"
      glob: "*.{js,ts,tsx}"
      run: |
        if [ -d node_modules ]; then
          npx eslint {staged_files}
        else
          echo "eslint skipped: web/node_modules is missing; run 'just web-install' to lint the page here."
        fi

    - name: gitleaks
      # Scan ONLY staged changes; a non-zero exit blocks the commit.
      # Fail CLOSED if gitleaks is missing — secret scanning is mandatory.
      run: |
        if ! command -v gitleaks >/dev/null 2>&1; then
          echo "gitleaks is not installed — secret scanning is required before committing."
          echo "Install it:  brew bundle   (installs gitleaks + detect-secrets + lefthook)"
          exit 1
        fi
        gitleaks git --pre-commit --redact --staged --no-banner --verbose
      fail_text: |
        Commit blocked: gitleaks flagged a possible secret in your staged changes
          (or gitleaks is not installed). Review the finding above.
          - Real secret? Remove it; use Rails encrypted credentials or a secrets manager.
          - False positive? Allowlist it in .gitleaks.toml ([[allowlists]]) or add its
            fingerprint to .gitleaksignore. Do NOT --no-verify past a real secret.
