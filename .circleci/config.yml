version: 2.1

executors:
  # No database, no browser: the two scanners and RuboCop.
  ruby:
    docker:
      - image: cimg/ruby:4.0.6
    working_directory: ~/openlanes

commands:
  install_packages:
    description: >-
      The apt packages the runner image does not carry. Note the absence of
      google-chrome-stable, which the GitHub `test` job installed: the
      `-browsers` image variant already ships it, and layering a second Chrome
      over the top is how a browser and a driver stop agreeing.

    steps:
      - run:
          name: Install packages
          command: |
            sudo apt-get update
            # lsof: spec/integration finds the engine's API server by its port, and skips without it.
            sudo apt-get install --no-install-recommends -y curl libjemalloc2 libvips lsof

  bundle_deps:
    description: >-
      Replaces `bundler-cache: true`. Same idea, spelled out: restore, install,
      save, keyed on Gemfile.lock — the gem's bundle is the only one
      this repo has, and it does not sit at the root.
    steps:
      - restore_cache:
          keys:
            - v3-bundle-{{ arch }}-{{ checksum ".ruby-version" }}-{{ checksum "Gemfile.lock" }}
            - v3-bundle-{{ arch }}-{{ checksum ".ruby-version" }}-
      - run:
          name: Install Ruby dependencies
          command: |
            bundle config set --local path vendor/bundle
            bundle install --jobs=4 --retry=3
            bundle clean --force
      - save_cache:
          key: v3-bundle-{{ arch }}-{{ checksum ".ruby-version" }}-{{ checksum "Gemfile.lock" }}
          paths:
            - vendor/bundle

jobs:
  linter:
    executor: ruby
    steps:
      - checkout
      - install_packages
      - bundle_deps
      # `-f github` emitted GitHub's command annotations, which mean
      # nothing to CircleCI's log renderer. Plain output; the offences are
      # identical.
      - run:
          command: BUNDLE_GEMFILE=Gemfile bundle exec rubocop
          name: Lint with Rubocop

  test:
    # ubuntu-latest is 4 vCPU / 16 GB; CircleCI's `medium` is 2 vCPU. `large`
    # is the closest match. Drop to `medium` if the credit burn matters more
    # than the wall clock — nothing here needs the extra cores to be correct.
    resource_class: medium
    docker:
      - image: cimg/ruby:4.0.6
      # The Live store's shared examples run against a real Redis as well as the in-memory fake.
      - image: cimg/redis:7.4
    working_directory: ~/openlanes
    steps:
      - checkout
      - install_packages
      - bundle_deps
      - run:
          name: Wait for Redis
          command: dockerize -wait tcp://localhost:6379 -timeout 30s
      # spec/integration skips here: it needs web/dist, which the e2e job builds and runs it against.
      - run:
          name: Run tests
          command: bundle exec rspec
      # The whole-library figure hides a new file with half its lines untested; this gates each changed lib/ file.
      - run:
          name: Coverage of changed files
          command: |
            git fetch --no-tags origin main
            bin/coverage-changed --base origin/main
      # Names the draft used and the code never did; the demo board's RNG seed is the one legitimate 4747.
      # Whole words only, so a port like 14747 or a hash passes; the exemption names one path, not every
      # file that shares its basename, as grep's --exclude would.
      - run:
          name: No retired names
          command: |
            hits=$(grep -rnE '\btilda\b|\b4747\b|agentilda:' README.md lib web/src | grep -v '^lib/openlanes/web/demo_board\.rb:' || true)
            if [ -n "$hits" ]; then
              echo "$hits"
              echo "retired name found: the binary is openlanes, the port 11000, the Redis prefix openlanes:" >&2
              exit 1
            fi

  # The page: lint, types, unit tests with coverage, and the production build that ships in the gem.
  web:
    docker:
      - image: cimg/node:22.21
    working_directory: ~/openlanes
    steps:
      - checkout
      - restore_cache:
          keys:
            - v1-npm-{{ arch }}-{{ checksum "web/package-lock.json" }}
      - run:
          name: Install web dependencies
          working_directory: web
          command: CYPRESS_INSTALL_BINARY=0 npm ci
      - save_cache:
          key: v1-npm-{{ arch }}-{{ checksum "web/package-lock.json" }}
          paths:
            - ~/.npm
      - run:
          name: Lint and type-check
          working_directory: web
          command: npm run lint && npm run typecheck
      - run:
          name: Unit tests with coverage
          working_directory: web
          command: npm run coverage
      - run:
          name: Coverage of changed files
          working_directory: web
          command: |
            git fetch --no-tags origin main
            npm run coverage:changed
      - run:
          name: Build
          working_directory: web
          command: npm run build
      - store_artifacts:
          path: web/coverage

  # The page in a browser against `openlanes web --demo`: the built web/dist, the API server and a real Redis, driven
  # by Cypress. Unlike `web`, this job installs the Cypress binary, so CYPRESS_INSTALL_BINARY is left alone here.
  e2e:
    resource_class: medium
    docker:
      - image: cimg/ruby:4.0.6-browsers
      - image: cimg/redis:7.4
    working_directory: ~/openlanes
    environment:
      E2E_REDIS_URL: redis://localhost:6379/14
    steps:
      - checkout
      - install_packages
      - run:
          name: Install Node and Cypress's system libraries
          command: |
            # The -browsers image ships Node; install it only if a future image stops doing so.
            if ! command -v node >/dev/null; then
              curl -fsSL https://deb.nodesource.com/setup_22.x | sudo -E bash -
              sudo apt-get install --no-install-recommends -y nodejs
            fi
            node --version
            # Cypress's own Electron needs these beside Chrome's. Ubuntu 24.04 renamed two of them with a t64 suffix.
            sudo apt-get install --no-install-recommends -y libgtk-3-0t64 libgbm-dev libnotify-dev libnss3 libxss1 \
              libasound2t64 libxtst6 xauth xvfb \
              || sudo apt-get install --no-install-recommends -y libgtk-3-0 libgbm-dev libnotify-dev libnss3 libxss1 \
              libasound2 libxtst6 xauth xvfb
      - bundle_deps
      - restore_cache:
          keys:
            - v1-e2e-npm-{{ arch }}-{{ checksum "web/package-lock.json" }}
      - run:
          name: Install web dependencies and the Cypress binary
          working_directory: web
          command: npm ci && npx cypress verify
      - save_cache:
          key: v1-e2e-npm-{{ arch }}-{{ checksum "web/package-lock.json" }}
          paths:
            - ~/.npm
            - ~/.cache/Cypress
      - run:
          name: Build the page
          working_directory: web
          command: npm run build
      # The gemspec aborts without web/dist/index.html; this proves the built .gem carries it.
      - run:
          name: Package the gem with the page
          command: |
            gem build openlanes.gemspec --output /tmp/openlanes.gem
            tar -xOf /tmp/openlanes.gem data.tar.gz | tar -tz | grep -x 'web/dist/index.html'
      - run:
          name: Wait for Redis
          command: dockerize -wait tcp://localhost:6379 -timeout 30s
      # Real exe/openlanes processes (engine, API server, two checkouts) on this Redis, each spec on its own database.
      - run:
          name: Integration specs
          command: bundle exec rspec spec/integration
          environment:
            OPENLANES_TEST_REDIS_URL: redis://localhost:6379/15
      # The same script as `just web-e2e`: both demo servers (the page's own and demo@second-machine for the chat
      # spec), then Cypress against them, then both stopped.
      - run:
          name: Cypress against two demo servers
          command: bin/web-e2e
      # `when` belongs to run steps only, so the failure decides what is copied, and the copy is always stored:
      # empty after a green run, the videos and screenshots after a red one.
      - run:
          name: Keep Cypress's videos and screenshots
          when: on_fail
          command: mkdir -p /tmp/cypress && cp -R web/cypress/videos web/cypress/screenshots /tmp/cypress/ 2>/dev/null || true
      - store_artifacts:
          path: /tmp/cypress

workflows:
  # .github/workflows/ci.yml + lint.yml + biome.yml. They are separate files on
  # GitHub only because that is the unit GitHub schedules; nothing depended on
  # them being independent, and one workflow gives one status to read.
  ci:
    jobs:
      - test
      - linter
      - web
      - e2e
