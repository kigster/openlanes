id: research-fast
agent: researcher
depth: fast
description: >
  A bare spec asking two narrow questions. At fast depth researcher names the retry
  helper the repository already has, one package that could replace it, and
  the question the scan cannot settle, then stops: three short parts, a small
  bill.
fixture:
  state: new
  slug: billing-retries
  files:
    spec.md: |
      # Billing Retries

      Jobs that call the Example Corp billing API fail on transient 503 responses. Retry them.

      ## What research needs to settle

      1. Does the repository already have a retry helper we can reuse?
      2. What backoff does the billing API ask clients to use?
  repo:
    lib/retry_policy.rb: |
      # Bounded exponential backoff: 3 attempts, 0.5s base, doubling.
      class RetryPolicy
        ATTEMPTS = 3
        BASE = 0.5
      end
    lib/billing_client.rb: |
      class BillingClient
        def charge(amount) = post("/charges", amount:)
      end
expect:
  state: researched
  signed: true
  files_absent: [plan.md]
  sections:
    spec.md: [Research, Reuse in this repo, Existing components, Open questions for spec-writer]
  contains:
    spec.md: [lib/retry_policy.rb]
  depth:
    fast:
      words: { file: spec.md, section: Research, min: 30, max: 250 }
      count: { file: spec.md, section: Research, pattern: 'https?://', min: 1, max: 4 }
      max_seconds: 180
      max_tokens: 60000
    medium:
      words: { file: spec.md, section: Research, min: 60, max: 450 }
      count: { file: spec.md, section: Research, pattern: 'https?://', min: 1, max: 6 }
      max_seconds: 300
      max_tokens: 100000
    deep:
      words: { file: spec.md, section: Research, min: 80, max: 700 }
      count: { file: spec.md, section: Research, pattern: 'https?://', min: 2, max: 8 }
      max_seconds: 300
      max_tokens: 150000
