id: research-deep
agent: leah-researcher
depth: deep
description: >
  A spec that touches a regulated rule. Even at deep depth leah only scans and
  searches: she names the reusable file, a package or two, and lists the
  regulatory questions for yoda without answering them. The old chapter, with
  contradictions and settled answers after a long run, fails here.
fixture:
  state: new
  slug: filing-deadlines
  files:
    spec.md: |
      # Filing Deadlines

      Show each small business its next estimated-tax filing deadline, moved for weekends and holidays.

      ## What research needs to settle

      1. Which deadlines apply, and where do they come from?
      2. How is a deadline moved when it falls on a weekend or holiday?
      3. Does the codebase already know about holidays?
  repo:
    lib/calendar.rb: |
      # Business days only; holidays are hard-coded for 2025.
      module Calendar
        HOLIDAYS = %w[2025-01-01 2025-07-04 2025-12-25].freeze
      end
expect:
  state: researched
  signed: true
  files_absent: [plan.md]
  sections:
    spec.md: [Research, Reuse in this repo, Existing components, Open questions for yoda]
  contains:
    spec.md: [lib/calendar.rb]
  depth:
    fast:
      words: { file: spec.md, section: Research, min: 30, max: 250 }
      count: { file: spec.md, section: Research, pattern: 'https?://', min: 1, max: 4 }
      max_seconds: 180
      max_tokens: 60000
    medium:
      words: { file: spec.md, section: Research, min: 60, max: 450 }
      count: { file: spec.md, section: Research, pattern: 'https?://', min: 1, max: 6 }
      max_seconds: 300
      max_tokens: 100000
    deep:
      words: { file: spec.md, section: Research, min: 80, max: 700 }
      count: { file: spec.md, section: Research, pattern: 'https?://', min: 2, max: 8 }
      max_seconds: 300
      max_tokens: 150000
