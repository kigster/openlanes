id: ui-medium
agent: frontend-coder
depth: medium
description: >
  One front-end unit against a back end that already landed: show the cart's
  quantity error next to the field. frontend-coder must change the interface and its
  test, paste the integration proof, and leave the back end alone.
fixture:
  state: building_ui
  slug: quantity-error
  files:
    spec.md: |
      # Quantity Error

      ## Goal

      The cart page shows `Cart::InvalidQuantity`'s message next to the quantity field.
    plan.md: |
      # Plan

      1. U1 (back end, done) raises `Cart::InvalidQuantity`.
      2. U2 (front end) shows it. Integration: add -1 in the browser, see the message.
    plan-frontend.md: |
      ## U2 Show the quantity error

      - **Discipline:** front end
      - **Owns:** `web/cart_badge.js`, `web/cart_badge.test.js`
      - **Must not touch:** `lib/cart.rb`
      - **Depends on:** U1
      - **Done when:** `web/cart_badge.test.js` "shows the error" passes
  repo:
    lib/cart.rb: |
      class Cart
        class InvalidQuantity < ArgumentError; end
      end
    web/cart_badge.js: |
      export function render(cart) {
        return `<span class="badge">${cart.count}</span>`;
      }
    web/cart_badge.test.js: |
      import { render } from "./cart_badge.js";
      test("renders the count", () => expect(render({ count: 2 })).toContain("2"));
expect:
  signed: true
  files_exist: [pull-requests.md]
  contains:
    pull-requests.md: ["/[Ii]ntegration/"]
  changed_paths: [web/*.js, web/*.test.js]
  untouched: [lib/**]
  depth:
    medium:
      changed_files: { min: 2, max: 6 }
      changed_lines: { min: 4, max: 200 }
      max_seconds: 1200
      max_tokens: 200000
