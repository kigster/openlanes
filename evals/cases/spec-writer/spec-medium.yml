id: spec-medium
agent: spec-writer
depth: medium
description: >
  A researched spec. spec-writer must write every section of a full specification,
  at least three Non-Goals, and leave plan.md blank for the planner; a
  heading in plan.md would claim the plan was already written.
fixture:
  state: researched
  slug: cart-quantity-limits
  files:
    spec.md: |
      # Cart Quantity Limits

      Customers of Example Corp's shop can add negative or absurd quantities to a cart.

      ## What research needs to settle

      1. Where is quantity validated today?

      ## Research

      1. Nowhere. `lib/cart.rb:4` stores whatever `add` receives.
      2. The checkout service rejects quantities above 99 with a 422 (`lib/checkout.rb:12`).

      ### Could not settle

      1. Whether zero should remove the line or be rejected.
expect:
  state: ready_for_planning
  signed: true
  files_exist: [plan.md]
  sections:
    spec.md: [Goal, Non-Goals, In scope, Out of scope, Back end / front end, Open questions, Risks, Conclusion]
  depth:
    medium:
      words: { file: spec.md, min: 250, max: 2500 }
      count: { file: spec.md, section: Non-Goals, pattern: '^[ \t]*(?:[-*]|\d+\.)[ \t]', min: 3, max: 8 }
      max_seconds: 900
      max_tokens: 150000
