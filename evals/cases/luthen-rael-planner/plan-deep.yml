id: plan-deep
agent: luthen-rael-planner
depth: deep
description: >
  A spec with a shared file and three in-scope items. At deep depth the plan
  must split it into several units with ownership, ordering for the shared
  file and a named integration check; a single vague unit is too shallow.
fixture:
  state: ready_for_planning
  slug: duplicate-job-ids
  files:
    spec.md: |
      ---
      frontend: false
      ---
      # Duplicate Job IDs

      ## Goal

      The job queue refuses a job whose ID is already queued, and says which job holds it.

      ## In scope

      - `Queue#push` rejects a duplicate ID with `Queue::Duplicate`.
      - The worker logs the rejected ID and the holder.
      - `config/queue.yml` gains `dedupe: true`, read by both.
    plan.md: ""
expect:
  state: planned
  signed: true
  files_exist: [plan.md, plan-backend.md, plan-frontend.md]
  contains:
    plan.md: ["/[Ii]ntegration/"]
    plan-backend.md: ["Owns:", "Must not touch:", "Depends on:", "Done when:"]
  depth:
    fast:
      count: { file: plan-backend.md, pattern: "Discipline:", min: 1, max: 3 }
      words: { file: plan.md, max: 300 }
      max_seconds: 300
      max_tokens: 80000
    medium:
      count: { file: plan-backend.md, pattern: "Discipline:", min: 2, max: 6 }
      words: { file: plan.md, min: 80, max: 1200 }
      max_seconds: 450
      max_tokens: 150000
    deep:
      count: { file: plan-backend.md, pattern: "Discipline:", min: 3, max: 8 }
      words: { file: plan.md, min: 150, max: 2500 }
      max_seconds: 600
      max_tokens: 300000
