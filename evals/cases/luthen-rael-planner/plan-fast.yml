id: plan-fast
agent: luthen-rael-planner
depth: fast
description: >
  A one-change spec. At fast depth the plan is one or two units with every
  field filled in; six units for a one-line validation is overdone.
fixture:
  state: ready_for_planning
  slug: reject-empty-titles
  files:
    spec.md: |
      ---
      frontend: false
      ---
      # Reject Empty Titles

      ## Goal

      `create` refuses an empty title with exit 2 and creates no folder.

      ## In scope

      - `Creator#create("")` raises; the CLI exits 2; a spec proves both.
    plan.md: ""
expect:
  state: planned
  signed: true
  files_exist: [plan.md, plan-backend.md, plan-frontend.md]
  contains:
    plan.md: ["/[Ii]ntegration/"]
    plan-backend.md: ["Owns:", "Must not touch:", "Depends on:", "Done when:"]
  depth:
    fast:
      count: { file: plan-backend.md, pattern: "Discipline:", min: 1, max: 3 }
      words: { file: plan.md, max: 300 }
      max_seconds: 300
      max_tokens: 80000
    medium:
      count: { file: plan-backend.md, pattern: "Discipline:", min: 2, max: 6 }
      words: { file: plan.md, min: 80, max: 1200 }
      max_seconds: 450
      max_tokens: 150000
    deep:
      count: { file: plan-backend.md, pattern: "Discipline:", min: 3, max: 8 }
      words: { file: plan.md, min: 150, max: 2500 }
      max_seconds: 600
      max_tokens: 300000
