id: build-medium
agent: backend-coder
depth: medium
description: >
  One back-end unit: reject a negative quantity in Cart#add, with a test.
  The folder's 🟢 needs a published pull request, which an eval never opens,
  so this case checks the signature and the diff: code and its test changed,
  nothing outside the unit's files touched.
fixture:
  state: planned
  slug: negative-quantity
  files:
    spec.md: |
      ---
      frontend: false
      ---
      # Negative Quantity

      ## Goal

      `Cart#add` rejects a quantity below 1.
    plan.md: |
      # Plan

      1. U1 Reject negative quantity (back end). Integration: U1's spec.
    plan-backend.md: |
      ## U1 Reject negative quantity

      - **Discipline:** back end
      - **Owns:** `lib/cart.rb`, `spec/cart_spec.rb`
      - **Must not touch:** `Gemfile`
      - **Depends on:** nothing
      - **Done when:** `spec/cart_spec.rb` "rejects a negative quantity" passes
    plan-frontend.md: |
      No front-end work in this plan.
  repo:
    Gemfile: |
      source "https://rubygems.org"
      gem "rspec"
    lib/cart.rb: |
      class Cart
        def initialize = @lines = {}

        def add(sku, quantity)
          @lines[sku] = quantity
        end
      end
    spec/cart_spec.rb: |
      require_relative "../lib/cart"

      RSpec.describe Cart do
        it "adds a line" do
          expect(described_class.new.add("A1", 2)).to eq(2)
        end
      end
expect:
  signed: true
  files_exist: [pull-requests.md]
  contains:
    pull-requests.md: ["# Pull Requests"]
  changed_paths: [lib/**/*.rb, spec/**/*_spec.rb]
  untouched: [Gemfile]
  depth:
    medium:
      changed_files: { min: 2, max: 6 }
      changed_lines: { min: 4, max: 200 }
      max_seconds: 1200
      max_tokens: 250000
