project: openlanes
starts: research
frontend: true
jobs: 5
desired_codebase_quality: high
merge:
  by: auto
application:
  name: openlanes
  description: A command-line software factory that drives plan folders through spec, plan, build and review with specialist agents
  current_phase: alpha
  commands:
    setup: bin/setup
    before_start: just web-build
    start:
    - just start
    stop:
    - openlanes stop
    backend_tests: just test
    frontend_tests: just web-test
    other_tests: just web-e2e
    ci_tests: just ci
coverage:
  command: bundle exec rspec
  minimum: 95
  report_command: jq '.result.line' coverage/.last_run.json
architecture_decisions:
  version: 1
  detail: medium
  current:
    layout: library
    languages:
    - ruby
    - node
    frameworks:
    - sinatra
    - vite
    task_runners:
    - just
    - rake
    dev_start:
    - mprocs
    secrets:
    - sopsy
    - dotenv
    env_loading:
    - direnv
    ci:
    - circleci
    deployment:
    - gem
    front_end:
    - react
    caching:
    - redis
    logins:
    - none
    testing:
    - rspec
    - vitest
    - cypress
  target:
    layout: library
    languages:
    - ruby
    - node
    frameworks:
    - sinatra
    - vite
    task_runners:
    - just
    - rake
    dev_start:
    - mprocs
    secrets:
    - sopsy
    - dotenv
    env_loading:
    - direnv
    ci:
    - circleci
    deployment:
    - gem
    front_end:
    - react
    caching:
    - redis
    logins:
    - none
    testing:
    - rspec
    - vitest
    - cypress
coverage:
  command: bundle exec rspec
  report_command: cat coverage/coverage.json | jq '.total.lines.percent'
  minimum: 95
chime: false
