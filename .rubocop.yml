inherit_from:
  - .rubocop_todo.yml
  - .relaxed_rubocop.yml

AllCops:
  SuggestExtensions: false
  TargetRubyVersion: 4.0
  NewCops: enable
  Include:
    - '**/*.rb'
  Exclude:
    - "bin/**/*"
    - "vendor/bundle/**/*"
    # Recorded agent output: data the scorers read, deliberately imperfect in fail/.
    - "evals/cases/**/*"

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

plugins:
  - rubocop-rspec

Layout/LineLength:
  Max: 120

Metrics/MethodLength:
  Max: 50

Metrics/ClassLength:
  Max: 100

# --- Alignment Rules (your main obsession) ---

Layout/ArgumentAlignment:
  EnforcedStyle: with_fixed_indentation

Layout/HashAlignment:
  EnforcedColonStyle: table
  EnforcedHashRocketStyle: table

Layout/MultilineMethodArgumentLineBreaks:
  Enabled: true

Layout/FirstArgumentIndentation:
  EnforcedStyle: consistent

Layout/ParameterAlignment:
  EnforcedStyle: with_fixed_indentation

Layout/ExtraSpacing:
  AllowForAlignment: true

# --- Hash formatting (this is where the magic mostly happens) ---

Layout/SpaceAroundOperators:
  Enabled: true

Layout/SpaceBeforeFirstArg:
  Enabled: true

# --- RSpec configuration ---

RSpec:
  Enabled: true

# Allow rspec-its style:
RSpec/DescribeClass:
  Enabled: false

# This prevents RuboCop from whining about one-liners
RSpec/ExampleLength:
  Max: 20

# --- Relaxed rules (because life is short) ---
Style/Documentation:
  Enabled: false

Style/FrozenStringLiteralComment:
  Enabled: false

Metrics/BlockLength:
  Exclude:
    - "spec/**/*"

Style/OptionalBooleanParameter:
  Enabled: false

Naming/PredicateMethod:
  Enabled: false

RSpec/MultipleExpectations:
  Enabled: false

Style/SingleArgumentDig:
  Enabled: false

RSpec/MultipleMemoizedHelpers:
  Enabled: false


# The gem is `openlanes` while the namespace is `OpenLanes`; without this the
# cop wants every spec under spec/open_lanes/.
RSpec/SpecFilePathFormat:
  CustomTransform:
    OpenLanes: openlanes
