# The Slack app OpenLanes asks its questions through. Paste this at
# https://api.slack.com/apps > Create New App > From a manifest.
# See docs/slack.md for the rest of the setup.
display_information:
  name: OpenLanes
  description: Asks the questions OpenLanes agents are blocked on
features:
  bot_user:
    display_name: openlanes
    always_online: false
oauth_config:
  scopes:
    bot:
      - chat:write
      - reactions:read
      - reactions:write
      - channels:history
      - groups:history
      - users:read
settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
