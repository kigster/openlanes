openapi: 3.1.0
info:
  title: openlanes board snapshot, plan 019.00 addition
  version: "019.00"
  description: >
    Additive change only. Every car in the board snapshot carries `subagents`, the names of its sub-agents in flight.
    Every other field of the snapshot is unchanged and described by
    web/src/api/types.ts and web/src/api/fixtures/snapshot.json.
paths: {}
components:
  schemas:
    Car:
      type: object
      description: One agent at work on one plan (`Live::Snapshot#car`).
      required: [key, agent, subagents]
      properties:
        key:
          type: string
          example: 001.00/rey-frontend
        agent:
          type: string
          example: rey-frontend
        subagents:
          type: array
          items:
            type: string
          description: >
            Names of the sub-agents in flight now, oldest first: started and
            not yet ended. The count is its length. Empty when none, never
            null; empties again when they end. Older engines omit the field;
            a reader treats a missing field as empty. Codex and Pi agents
            always report an empty list.
          example: [Explore, general-purpose, Plan]
      additionalProperties: true
