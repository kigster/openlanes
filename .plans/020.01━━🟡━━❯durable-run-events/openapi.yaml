openapi: 3.1.0
info:
  title: OpenLanes Reports API (plan 020.01)
  version: 0.1.0
  description: >
    The aggregates behind `openlanes events report`, served to the web Reports page.
    `result` is `OpenLanes::Events::Report::Result#to_h`, field for field.
paths:
  /api/reports:
    get:
      summary: Run, block, PR and usage aggregates
      parameters:
        - name: since
          in: query
          required: false
          schema: { type: string, format: date-time }
        - name: plan
          in: query
          required: false
          schema: { type: string, pattern: '^\d{3}\.\d{2}$' }
      responses:
        "200":
          description: The report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reports" }
        "400":
          description: Malformed since or plan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: events.enabled is not true in .openlanes.yml
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: A configured database cannot be reached
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
components:
  schemas:
    Error:
      type: object
      required: [error, message]
      properties:
        error: { type: string, enum: [bad_param, events_disabled, database_unavailable] }
        message: { type: string }
    Reports:
      type: object
      required: [source, generated_at, result]
      properties:
        source: { type: string, enum: [database, log] }
        generated_at: { type: string, format: date-time }
        result: { $ref: "#/components/schemas/Result" }
    Result:
      type: object
      required: [runs, completion_rate, blocks, runs_needing_feedback, intervention_rate,
        time_to_answer, pr_outcomes, usage_by_run, usage_by_model, skipped_lines]
      properties:
        runs: { type: integer }
        completion_rate: { type: [number, "null"], minimum: 0, maximum: 1 }
        blocks: { type: integer }
        runs_needing_feedback: { type: integer }
        intervention_rate: { type: [number, "null"], minimum: 0, maximum: 1 }
        time_to_answer:
          type: object
          required: [count, median_s, max_s]
          properties:
            count: { type: integer }
            median_s: { type: [number, "null"] }
            max_s: { type: [number, "null"] }
        pr_outcomes:
          type: object
          required: [opened, reviewed, merged, closed]
          properties:
            opened: { type: integer }
            reviewed: { type: integer }
            merged: { type: integer }
            closed: { type: integer }
        usage_by_run:
          type: array
          items: { $ref: "#/components/schemas/Usage" }
        usage_by_model:
          type: array
          items: { $ref: "#/components/schemas/Usage" }
        skipped_lines: { type: integer }
    Usage:
      type: object
      required: [run, adapter, model, invocations, input_tokens, output_tokens, cost_usd, estimated, incomplete]
      properties:
        run: { type: [string, "null"] }
        adapter: { type: string }
        model: { type: [string, "null"] }
        invocations: { type: integer }
        input_tokens: { type: [integer, "null"] }
        output_tokens: { type: [integer, "null"] }
        cost_usd: { type: [number, "null"], description: "null means unknown: render 'unknown', never $0" }
        estimated: { type: boolean, description: "true: render (est.)" }
        incomplete: { type: boolean }
